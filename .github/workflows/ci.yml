name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and recursive dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify deterministic rule fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv /tmp/rule2sor-venv
          /tmp/rule2sor-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          mkdir -p /tmp/rule2sor-wheel
          /tmp/rule2sor-venv/bin/python -m pip download --only-binary=:all: --no-deps --dest /tmp/rule2sor-wheel rule2sor==0.1.0
          wheel=/tmp/rule2sor-wheel/rule2sor-0.1.0-py3-none-any.whl
          test -f "$wheel"
          test "$(sha256sum "$wheel" | cut -d' ' -f1)" = "8893b4cd5d9f2008cc6a8eb484ff241d84631f5e224ab1b861fc104f6e3631d7"
          /tmp/rule2sor-venv/bin/python -m pip install "$wheel"
          RULE2SOR=/tmp/rule2sor-venv/bin/rule2sor python tools/generate_demo_fixtures.py --check

      - name: Format integration crate
        run: cargo fmt --manifest-path crates/schc-coreconf/Cargo.toml -- --check

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Run real-process demonstration
        run: bash tools/run_demo.sh
