[package]
name = "schc-coreconf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Atomic SCHC CORECONF active-context backend"

[dependencies]
arc-swap = "1.7"
ciborium = "0.2"
# Gitlinks pin these path dependencies to the recorded submodule revisions.
# rustconf: 1611ec1; r-schc: cf0b9bc.
coreconf-model = { path = "../../deps/rustconf/crates/coreconf-model" }
coreconf-runtime = { path = "../../deps/rustconf/crates/coreconf-runtime" }
schc-core = { path = "../../deps/r-schc/crates/schc-core" }
schc-runtime = { path = "../../deps/r-schc/crates/schc-runtime" }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[lints]
workspace = true
